{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block body_class %}dashboard-page{% endblock %}

{% block content %}
<main class="teachers-page connections-page">
  <section class="page-section">
    <div class="page-section__header">
      <h2>Задания твоей группы</h2>
      <p class="subtitle">Все задания по твоей группе и курсу.</p>
    </div>

    <!-- Табы фильтрации: Активные / Завершённые -->
    <div class="task-filter-bar">
      <button class="task-filter-btn active" data-status="active" onclick="switchStatus('active', this)">Активные</button>
      <button class="task-filter-btn" data-status="completed" onclick="switchStatus('completed', this)">Завершённые</button>
    </div>

    <!-- Контейнер со списком заданий, заполняется через JS -->
    <div class="teacher-list" id="tasks-list">
      <p class="subtitle">Загрузка...</p>
    </div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth/auth-api.js"></script>
<script>
  var currentStatus = 'active';

  function switchStatus(status, btn) {
    currentStatus = status;
    // Обновляем активное состояние кнопок
    document.querySelectorAll('.task-filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    loadTasks(status);
  }

  function formatDate(isoStr) {
    if (!isoStr) return '';
    var d = new Date(isoStr);
    var day = String(d.getDate()).padStart(2, '0');
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var year = d.getFullYear();
    var hours = String(d.getHours()).padStart(2, '0');
    var minutes = String(d.getMinutes()).padStart(2, '0');
    return day + '.' + month + '.' + year + ' ' + hours + ':' + minutes;
  }

  async function loadTasks(status) {
    var list = document.getElementById('tasks-list');
    list.innerHTML = '<p class="subtitle">Загрузка...</p>';

    try {
      var resp = await authFetch('/api/tasks/list?status=' + status);
      if (!resp.ok) {
        list.innerHTML = '<p class="subtitle">Ошибка загрузки заданий.</p>';
        return;
      }
      var tasks = await resp.json();
      renderTasks(tasks, status);
    } catch (e) {
      list.innerHTML = '<p class="subtitle">Ошибка сети.</p>';
    }
  }

  function renderTasks(tasks, status) {
    var list = document.getElementById('tasks-list');

    if (!tasks || tasks.length === 0) {
      if (status === 'active') {
        list.innerHTML = '<p class="subtitle">У тебя пока нет активных заданий.</p>';
      } else {
        list.innerHTML = '<p class="subtitle">Нет завершённых заданий за последние 7 дней.</p>';
      }
      return;
    }

    var html = '';
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      var burningHtml = '';
      if (status === 'active' && t.deadline) {
        var now = new Date();
        var dl = new Date(t.deadline);
        var diffDays = Math.floor((dl - now) / (1000 * 60 * 60 * 24));
        if (diffDays >= 0 && diffDays < 7) {
          burningHtml = ' <span style="margin-left: 5px;" title="До дедлайна меньше недели!">🔥</span>';
        }
      }

      html += '<article class="teacher-item" style="flex-direction: column; align-items: flex-start; gap: 12px;">'
        + '<div style="width: 100%;">'
        + '<span class="teacher-name" style="font-size: 18px; font-weight: 700;">'
        + escapeHtml(t.title) + burningHtml
        + '</span></div>';

      if (t.description) {
        html += '<p style="margin: 0; color: #1d1d1f; font-size: 15px; line-height: 1.5;">' + escapeHtml(t.description) + '</p>';
      }

      if (t.teacher_name) {
        html += '<p style="margin: 0; color: #86868b; font-size: 14px;">Преподаватель: ' + escapeHtml(t.teacher_name) + '</p>';
      }

      if (t.deadline) {
        var label = status === 'active' ? 'Срок:' : 'Был срок:';
        html += '<p style="margin: 0; color: #86868b; font-size: 14px;">' + label + ' до ' + formatDate(t.deadline) + '</p>';
      }

      if (t.file_path) {
        var fname = t.file_original_name || 'Задание';
        html += '<div style="display: flex; gap: 10px; margin-top: 8px; align-items: center;">'
          + '<a href="' + t.file_path + '" download="' + escapeHtml(fname) + '" '
          + 'style="background-color: #ff9f0a; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; text-decoration: none; display: inline-block;">'
          + 'Скачать файл</a>'
          + '<div style="background-color: #000000; color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; display: inline-block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">'
          + escapeHtml(fname) + '</div></div>';
      }

      html += '</article>';
    }

    list.innerHTML = html;
  }

  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

  // Первоначальная загрузка активных заданий
  loadTasks('active');
</script>
{% endblock %}
