<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />

  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body class="dashboard-page">
  <header class="header">
    <a class="logo" href="/dashboard/student">ACADEMIC FLOW</a>
    <nav class="nav">
      <a href="/dashboard/student">Главная</a>
