<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <main class="page-center">
        <section class="stack">
            <h1>
                Продолжай заниматься <span class="marker">учебой</span><br />
                с нами
            </h1>
            <form id="login-form" class="form-card" novalidate>
                <p id="form-message" class="form-message" role="alert"></p>
                <div class="form-group">
                    <label for="email">Почта</label>
                    <input id="email" name="email" class="input-field" type="email" placeholder="mail@example.com"
                        autocomplete="email" required />
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" class="input-field" type="password" placeholder="********"
                        autocomplete="current-password" required />
                </div>

                <button type="submit" class="btn-primary">Войти</button>
                <p class="auth-footnote">
                    Еще нет аккаунта? <a href="/register">Регистрация</a>
                </p>
            </form>
        </section>
    </main>
    <script src="/static/js/auth-login.js"></script>
</body>

</html>
